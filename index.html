<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf9f7;
    --text: #0d0c0b;
    --muted: #888;
    --rule: #e0ddd9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Helvetica Neue', Helvetica, 'Noto Sans KR', Arial, sans-serif;
    font-size: 14px;
    line-height: 1.7;
    padding: 48px 24px 80px;
  }
  .wrap { max-width: 520px; margin: 0 auto; }

  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 48px;
    font-size: 13px;
  }
  nav a { text-decoration: none; color: var(--text); }

  .intro { margin-bottom: 40px; }
  .intro-desc {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.8;
    font-weight: 300;
  }

  .archive-label {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
    border-top: 1px solid var(--rule);
    padding-top: 24px;
  }

  .entry-row {
    display: block;
    text-decoration: none;
    color: var(--text);
    padding: 14px 0;
    border-bottom: 1px solid var(--rule);
    transition: opacity 0.15s;
  }
  .entry-row:hover { opacity: 0.65; }
  .entry-row-inner {
    display: flex;
    gap: 16px;
    align-items: flex-start;
  }
  .entry-row-date {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    padding-top: 2px;
    min-width: 90px;
  }
  .entry-row-right { flex: 1; }
  .entry-row-title {
    font-size: 13.5px;
    font-weight: 500;
    margin-bottom: 3px;
  }
  .entry-row-desc {
    font-size: 11.5px;
    color: var(--muted);
  }

  footer {
    margin-top: 48px;
    padding-top: 20px;
    border-top: 1px solid var(--rule);
    font-size: 10px;
    color: #bbb;
    text-align: center;
  }
</style>
</head>
<body>
<div class="wrap">

  <nav>
    <a href="#" id="nav-brand-link">AI Brief</a>
  </nav>

  <div class="intro">
    <p class="intro-desc">크리에이터·디자이너를 위한 AI 뉴스 큐레이션. 매일 3가지 핵심 기사 + 영단어·핵심 표현으로 산업과 더불어 글로벌 인재가 되기 위한 영어 공부를 함께 즐겨보세요.</p>
  </div>

  <div class="archive-label">archive</div>
  <div id="archive"></div>

  <footer>© enblc3. Jeong A Mari Lee. All Rights Reserved.</footer>

</div>

<script>
const BRIEFS = [
  {
    "year": "2026",
    "month": "05",
    "day": "28",
    "displayDate": "2026.05.28",
    "title": "Daily AI Brief",
    "desc": "ChatGPT 음성 모드 구형 모델 논란 / Claude Code v2.1.152 보안 패치 / ElevenLabs $5억 조달",
    "url": "./daily-ai-brief-2026-05-28.html",
    "num": "002"
  },
  {
    "year": "2026",
    "month": "05",
    "day": "27",
    "displayDate": "2026.05.27",
    "title": "Daily AI Brief",
    "desc": "Google Pics AI 디자인 앱 / Gemini Omni 영상 생성 / OpenAI-MS 비독점 재편",
    "url": "./daily-ai-brief-2026-05-27.html",
    "num": "001"
  }
];

function render() {
  const container = document.getElementById('archive');
  BRIEFS.forEach(b => {
    const a = document.createElement('a');
    a.href = b.url;
    a.className = 'entry-row';
    a.innerHTML = `
      <div class="entry-row-inner">
        <span class="entry-row-date">• ${b.displayDate}</span>
        <div class="entry-row-right">
          <div class="entry-row-title">${b.title} — No.${b.num}</div>
          <div class="entry-row-desc">${b.desc}</div>
        </div>
      </div>`;
    container.appendChild(a);
  });
}

render();
document.getElementById('nav-brand-link').href = BRIEFS[0].url;
</script>
</body>
</html>
