<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf9f7;
    --text:#0d0c0b;
    --muted:#888;
    --rule:#e0ddd9;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Helvetica Neue', Helvetica, 'Noto Sans KR', Arial, sans-serif;
    font-weight:300;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    padding:0 24px;
  }
  .wrap{max-width:520px;margin:0 auto;padding:40px 0 60px;}

  nav{
    display:flex;justify-content:space-between;align-items:baseline;
    padding-bottom:18px;border-bottom:1px solid var(--rule);
  }
  nav .brand{font-size:15px;font-weight:500;letter-spacing:.02em;color:var(--text);text-decoration:none;}

  .intro{margin:26px 0 34px;}
  .intro-desc{font-size:13.5px;font-weight:300;line-height:1.8;color:var(--text);}

  .archive-label{font-size:11px;font-style:italic;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px;}

  a.entry-row{display:block;text-decoration:none;color:inherit;border-bottom:1px solid var(--rule);}
  .entry-row-inner{display:flex;gap:14px;padding:16px 0;align-items:baseline;}
  .entry-row-date{font-size:12px;color:var(--muted);white-space:nowrap;min-width:74px;}
  .entry-row-right{flex:1;}
  .entry-row-title{font-size:14px;font-weight:500;line-height:1.45;margin-bottom:4px;}
  .entry-row-desc{font-size:12px;font-weight:300;color:var(--muted);line-height:1.6;}
  a.entry-row:hover .entry-row-title{text-decoration:underline;}

  footer.footer{
    margin-top:40px;padding-top:18px;border-top:1px solid var(--rule);
  }
  footer.footer .copy{font-size:10px;color:#bbb;}
</style>
</head>
<body>
<div class="wrap">

  <nav>
    <a class="brand" id="nav-brand-link" href="#">AI Brief</a>
  </nav>

  <div class="intro">
    <p class="intro-desc">크리에이터·디자이너를 위한 AI 뉴스 큐레이션. 매일 3가지 핵심 기사 + 영단어·핵심 표현으로 산업과 더불어 글로벌 인재가 되기 위한 영어 공부를 함께 즐겨보세요.</p>
  </div>

  <div class="archive-label">archive</div>
  <div id="archive"></div>

  <footer class="footer">
    <span class="copy">© enblc3. Jeong A Mari Lee. All Rights Reserved.</span>
  </footer>

</div>

<script>

  {"year":"2026","month":"06","day":"04","displayDate":"2026.06.04","title":"Daily AI Brief","desc":"스코세이지 Black Forest Labs 합류·차기작 스토리보드에 Flux / MS 자체 추론·코딩 모델 MAI-Thinking-1·MAI-Code-1-Flash 공개 / Suno 54억 달러 가치에 4억 달러 유치","url":"./daily-ai-brief-2026-06-04.html","num":"010"},

function render() {
  const container = document.getElementById('archive');
  BRIEFS.forEach(b => {
    const a = document.createElement('a');
    a.href = b.url;
    a.className = 'entry-row';
    a.innerHTML = `
      <div class="entry-row-inner">
        <span class="entry-row-date">• ${b.displayDate}</span>
        <div class="entry-row-right">
          <div class="entry-row-title">${b.title} — No.${b.num}</div>
          <div class="entry-row-desc">${b.desc}</div>
        </div>
      </div>`;
    container.appendChild(a);
  });
}

render();
document.getElementById('nav-brand-link').href = BRIEFS[0].url;
</script>
</body>
</html>
