<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:    #faf9f7;
    --text:  #0d0c0b;
    --muted: #888;
    --rule:  #e0ddd9;
  }

  html { font-size: 14px; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Helvetica Neue', Helvetica, 'Noto Sans KR', Arial, sans-serif;
    font-weight: 400;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  a { color: inherit; }
  a:hover { opacity: 0.5; }

  /* NAV */
  .nav {
    max-width: 520px;
    margin: 0 auto;
    width: 100%;
    padding: 28px 24px 0;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 13px;
  }
  .nav-brand a { text-decoration: none; letter-spacing: 0.01em; }

  /* WRAP */
  .wrap {
    max-width: 520px;
    margin: 0 auto;
    width: 100%;
    padding: 48px 24px 100px;
    flex: 1;
  }

  /* TAB NAV */
  .tab-nav {
    display: flex;
    gap: 20px;
    margin-bottom: 48px;
  }
  .tab-nav a {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
  }
  .tab-nav a.active { color: var(--text); }
  .tab-nav a:hover { opacity: 0.5; }

  /* INTRO */
  .intro-desc {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.8;
    margin-bottom: 40px;
  }

  /* ARCHIVE LIST */
  #archive { display: flex; flex-direction: column; }

  a.entry-row {
    text-decoration: none;
    color: var(--text);
    display: block;
    border-top: 1px solid var(--rule);
    padding: 14px 0;
    transition: opacity 0.1s;
  }
  a.entry-row:last-child { border-bottom: 1px solid var(--rule); }
  a.entry-row:hover { opacity: 0.5; }

  .entry-row-inner {
    display: flex;
    gap: 16px;
    align-items: flex-start;
  }
  .entry-row-date {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    padding-top: 2px;
    min-width: 90px;
  }
  .entry-row-right { flex: 1; }
  .entry-row-title {
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 3px;
  }
  .entry-row-desc {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.6;
  }

  /* FOOTER */
  footer.footer {
    max-width: 520px;
    margin: 0 auto;
    width: 100%;
    padding: 20px 24px 40px;
    border-top: 1px solid var(--rule);
    font-size: 10px;
    color: #bbb;
  }
</style>
</head>
<body>

  <nav class="nav">
    <div class="nav-brand"><a id="nav-brand-link" href="#">AI Brief</a></div>
  </nav>

  <div class="wrap">
    <div class="tab-nav">
      <a href="./index.html" class="active">Archive</a>
      <a href="./ai-tools.html">AI Tools</a>
      <a href="./glossary.html">Dictionary</a>
    </div>

    <p class="intro-desc">크리에이터·디자이너를 위한 AI 뉴스 큐레이션. 매일 3가지 핵심 기사 + 영단어·핵심 표현으로 산업과 더불어 글로벌 인재가 되기 위한 영어 공부를 함께 즐겨보세요.</p>

    <div id="archive"></div>
  </div>

  <footer class="footer">
    © enblc3. Jeong A Mari Lee. All Rights Reserved.
  </footer>

<script>
const BRIEFS = [

    "url": "./daily-ai-brief-2026-05-30.html", "num": "006"
  },
  {
    "year": "2026", "month": "05", "day": "29",
    "displayDate": "2026.05.29", "title": "Daily AI Brief",

    "url": "./daily-ai-brief-2026-05-29.html", "num": "005"
  },
  {
    "year": "2026", "month": "05", "day": "28",
    "displayDate": "2026.05.28", "title": "Daily AI Brief",

    "url": "./daily-ai-brief-2026-05-28.html", "num": "004"
  },

  }
];

function render() {
  const container = document.getElementById('archive');
  BRIEFS.forEach(b => {
    const a = document.createElement('a');
    a.href = b.url;
    a.className = 'entry-row';
    a.innerHTML = `
      <div class="entry-row-inner">
        <span class="entry-row-date">• ${b.displayDate}</span>
        <div class="entry-row-right">
          <div class="entry-row-title">${b.title} — No.${b.num}</div>
          <div class="entry-row-desc">${b.desc}</div>
        </div>
      </div>`;
    container.appendChild(a);
  });
}

render();
document.getElementById('nav-brand-link').href = BRIEFS[0].url;
</script>
</body>
</html>
