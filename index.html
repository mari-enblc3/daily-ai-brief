<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Brief</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#faf9f7; --text:#0d0c0b; --muted:#888; --rule:#e0ddd9; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--text); font-family:'Helvetica Neue',Helvetica,'Noto Sans KR',Arial,sans-serif; font-size:14px; line-height:1.7; padding:0 16px; }
    .container { max-width:520px; margin:0 auto; padding:40px 0 60px; }
    nav { display:flex; justify-content:space-between; align-items:center; margin-bottom:40px; padding-bottom:16px; border-bottom:1px solid var(--rule); }
    nav a { text-decoration:none; color:var(--text); font-weight:500; font-size:13px; letter-spacing:.02em; }
    .intro { margin-bottom:36px; }
    .intro-desc { font-size:13px; color:var(--muted); line-height:1.8; }
    .archive-label { font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:14px; border-top:1px solid var(--rule); padding-top:20px; }
    a.entry-row { display:block; text-decoration:none; color:var(--text); border-bottom:1px solid var(--rule); padding:14px 0; transition:opacity .15s; }
    a.entry-row:hover { opacity:.65; }
    .entry-row-inner { display:flex; gap:16px; align-items:flex-start; }
    .entry-row-date { font-size:11px; color:var(--muted); white-space:nowrap; padding-top:2px; min-width:86px; }
    .entry-row-right { flex:1; }
    .entry-row-title { font-size:13px; font-weight:500; margin-bottom:3px; }
    .entry-row-desc { font-size:11px; color:var(--muted); line-height:1.6; }
    footer.footer { display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--rule); padding-top:20px; margin-top:36px; flex-wrap:wrap; gap:8px; }
    footer.footer a { color:var(--text); text-decoration:none; font-size:12px; font-weight:500; }
    .footer-copy { font-size:10px; color:#bbb; }
  </style>
</head>
<body>
<div class="container">
  <nav>
    <a href="#" id="nav-brand-link">AI Brief</a>
  </nav>
  <div class="intro">
    <p class="intro-desc">크리에이터·디자이너를 위한 AI 뉴스 큐레이션. 매일 3가지 핵심 기사 + 영단어·핵심 표현으로 산업과 더불어 글로벌 인재가 되기 위한 영어 공부를 함께 즐겨보세요.</p>
  </div>
  <div class="archive-label">archive</div>
  <div id="archive"></div>
  <footer class="footer">
    <a href="#" id="footer-link">AI Brief</a>
    <span class="footer-copy">© enblc3. Jeong A Mari Lee. All Rights Reserved.</span>
  </footer>
</div>
<script>
const BRIEFS = [
  {
    "year": "2026",
    "month": "05",
    "day": "26",
    "displayDate": "2026.05.25",
    "title": "Daily AI Brief",
    "desc": "X Creator Connect AI 크리에이터 매칭 / Google Stitch 실시간 AI UI 디자인 툴 / Anthropic $30B 펀딩 클로징 임박",
    "url": "./daily-ai-brief-2026-05-26b.html",
    "num": "002"
  },
  {
    "year": "2026",
    "month": "05",
    "day": "26",
    "displayDate": "2026.05.26",
    "title": "Daily AI Brief",
    "desc": "Krea 2 자체 파운데이션 모델 출시 / Google Gemini 3.5 Flash 공개 (I/O 2026) / Q1 AI VC 투자 $2,420억 역대 최고",
    "url": "./daily-ai-brief-2026-05-25.html",
    "num": "001"
  }
];
function render() {
  const container = document.getElementById('archive');
  BRIEFS.forEach(b => {
    const a = document.createElement('a');
    a.href = b.url;
    a.className = 'entry-row';
    a.innerHTML = `<div class="entry-row-inner"><span class="entry-row-date">• ${b.displayDate}</span><div class="entry-row-right"><div class="entry-row-title">${b.title} — No.${b.num}</div><div class="entry-row-desc">${b.desc}</div></div></div>`;
    container.appendChild(a);
  });
}
render();
document.getElementById('nav-brand-link').href = BRIEFS[0].url;
document.getElementById('footer-link').href = BRIEFS[0].url;
</script>
</body>
</html>
