<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Brief</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf9f7;
      --text: #0d0c0b;
      --muted: #888;
      --rule: #e0ddd9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Helvetica Neue', Helvetica, 'Noto Sans KR', Arial, sans-serif;
      font-size: 14px;
      line-height: 1.7;
      padding: 40px 20px 80px;
    }
    .container { max-width: 520px; margin: 0 auto; }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 32px;
    }
    nav a { text-decoration: none; color: var(--text); font-size: 13px; font-weight: 500; letter-spacing: 0.03em; }

    .intro { margin-bottom: 40px; }
    .intro-desc {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.9;
      max-width: 480px;
    }

    .archive-label {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    #archive { display: flex; flex-direction: column; gap: 0; }

    a.entry-row {
      display: block;
      text-decoration: none;
      color: var(--text);
      border-top: 1px solid var(--rule);
      padding: 16px 0;
      transition: background 0.1s;
    }
    a.entry-row:last-child { border-bottom: 1px solid var(--rule); }
    a.entry-row:hover { background: rgba(0,0,0,0.02); }

    .entry-row-inner { display: flex; gap: 16px; align-items: flex-start; }
    .entry-row-date { font-size: 11px; color: var(--muted); white-space: nowrap; padding-top: 2px; min-width: 88px; }
    .entry-row-right { flex: 1; }
    .entry-row-title { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
    .entry-row-desc { font-size: 11px; color: var(--muted); line-height: 1.6; }

    footer {
      display: flex;
      justify-content: center;
      padding-top: 40px;
      font-size: 10px;
      color: #bbb;
    }
  </style>
</head>
<body>
<div class="container">

  <nav>
    <a href="#" id="nav-brand-link">AI Brief</a>
  </nav>

  <div class="intro">
    <p class="intro-desc">크리에이터·디자이너를 위한 AI 뉴스 큐레이션. 매일 3가지 핵심 기사 + 영단어·핵심 표현으로 산업과 더불어 글로벌 인재가 되기 위한 영어 공부를 함께 즐겨보세요.</p>
  </div>

  <div class="archive-label">archive</div>
  <div id="archive"></div>

  <footer>© enblc3. Jeong A Mari Lee. All Rights Reserved.</footer>

</div>

<script>
const BRIEFS = [
  {
    "year": "2026",
    "month": "05",
    "day": "31",
    "displayDate": "2026.05.31",
    "title": "Daily AI Brief",
    "desc": "Adobe Firefly AI 어시스턴트 공개 베타 / Google Gemini Spark 미국 출시 / Anthropic 서울·밀라노 동시 오픈",
    "url": "./daily-ai-brief-2026-05-31.html",
    "num": "004"
  },
  {
    "year": "2026",
    "month": "05",
    "day": "31",
    "displayDate": "2026.05.31",
    "title": "Daily AI Brief",
    "desc": "Microsoft Build 2026 Windows AI 에이전트 OS 전환 / Claude Mythos FFmpeg 16년 취약점 발견 / Anthropic $9,650억으로 OpenAI 제치다",
    "url": "./daily-ai-brief-2026-05-31.html",
    "num": "003"
  },
  {
    "year": "2026",
    "month": "05",
    "day": "30",
    "displayDate": "2026.05.30",
    "title": "Daily AI Brief",
    "desc": "LumeFlow AI GPT Image 2 통합 영상 자동화 / YouTube AI 영상 자동 라벨링 / Anthropic Opus 4.8 Dynamic Workflows",
    "url": "./daily-ai-brief-2026-05-30.html",
    "num": "002"
  },
  {
    "year": "2026",
    "month": "05",
    "day": "29",
    "displayDate": "2026.05.29",
    "title": "Daily AI Brief",
    "desc": "Google Flow Tools로 나만의 AI 툴 제작 / ElevenLabs Music v2 장르 전환 모델 / Cognition $1B 투자 유치",
    "url": "./daily-ai-brief-2026-05-29.html",
    "num": "001"
  }
];

function render() {
  const container = document.getElementById('archive');
  BRIEFS.forEach(b => {
    const a = document.createElement('a');
    a.href = b.url;
    a.className = 'entry-row';
    a.innerHTML = `
      <div class="entry-row-inner">
        <span class="entry-row-date">• ${b.displayDate}</span>
        <div class="entry-row-right">
          <div class="entry-row-title">${b.title} — No.${b.num}</div>
          <div class="entry-row-desc">${b.desc}</div>
        </div>
      </div>`;
    container.appendChild(a);
  });
}

render();
document.getElementById('nav-brand-link').href = BRIEFS[0].url;
</script>
</body>
</html>
