<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Brief</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #faf9f7;
      color: #0d0c0b;
      font-family: 'Helvetica Neue', Helvetica, 'Noto Sans KR', Arial, sans-serif;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { color: inherit; }
    a:hover { opacity: 0.5; }

    /* ── NAV ── */
    .nav {
      max-width: 520px;
      margin: 0 auto;
      width: 100%;
      padding: 28px 24px 0;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 13px;
    }
    .nav-brand a { text-decoration: none; letter-spacing: 0.01em; }

    /* ── WRAP ── */
    .wrap {
      max-width: 520px;
      margin: 0 auto;
      width: 100%;
      padding: 48px 24px 80px;
      flex: 1;
    }

    /* ── INTRO ── */
    .intro {
      margin-bottom: 44px;
    }
    .intro-desc {
      font-size: 13px;
      color: #888;
      line-height: 1.75;
      max-width: 460px;
    }

    /* ── TAB NAV ── */
    .tab-nav {
      display: flex;
      gap: 20px;
      margin-bottom: 40px;
    }
    .tab-nav a {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #aaa;
      text-decoration: none;
    }
    .tab-nav a.active { color: #0d0c0b; }
    .tab-nav a:hover { opacity: 0.5; }

    /* ── ARCHIVE ── */
    .archive-label {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #aaa;
      margin-bottom: 14px;
    }

    .entry-row {
      display: block;
      text-decoration: none;
      padding: 14px 0;
      border-top: 1px solid #e0ddd9;
    }
    .entry-row:last-child { border-bottom: 1px solid #e0ddd9; }
    .entry-row:hover .entry-row-title { opacity: 0.5; }

    .entry-row-inner {
      display: flex;
      align-items: baseline;
      gap: 16px;
    }

    .entry-row-date {
      font-size: 11px;
      color: #888;
      flex-shrink: 0;
      letter-spacing: 0.02em;
    }

    .entry-row-right { flex: 1; min-width: 0; }

    .entry-row-title {
      font-size: 13.5px;
      line-height: 1.45;
      margin-bottom: 2px;
      transition: opacity 0.1s;
    }

    .entry-row-desc {
      font-size: 11.5px;
      color: #999;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── FOOTER ── */
    footer {
      max-width: 520px;
      margin: 0 auto;
      width: 100%;
      padding: 18px 24px 32px;
      border-top: 1px solid #e0ddd9;
      font-size: 10px;
      color: #bbb;
      letter-spacing: 0.01em;
    }

    @media (max-width: 560px) {
      .wrap { padding: 36px 20px 72px; }
      .nav { padding: 22px 20px 0; }
      footer { padding-left: 20px; padding-right: 20px; }
      .entry-row-desc { display: none; }
    }
  </style>
</head>
<body>

<nav class="nav">
  <div class="nav-brand"><a id="nav-brand-link" href="#">AI Brief</a></div>
</nav>

<div class="wrap">

  <div class="intro">
    <p class="intro-desc">크리에이터·디자이너를 위한 AI 뉴스 큐레이션. 매일 3가지 핵심 기사 + 영단어·핵심 표현으로 산업과 더불어 글로벌 인재가 되기 위한 영어 공부를 함께 즐겨보세요.</p>
  </div>

  <div class="tab-nav">
    <a href="./index.html" class="active">Archive</a>
    <a href="./ai-tools.html">AI Tools</a>
    <a href="./glossary.html">Dictionary</a>
  </div>

  <div id="archive"></div>

</div>

<footer>© enblc3. Jeong A Mari Lee. All Rights Reserved.</footer>

<script>
const BRIEFS = [
  {
    year: '2026', month: '05', day: '25',
    displayDate: '2026.05.25',
    title: 'Daily AI Brief',
    desc: 'Google Gemini × Adobe·Canva·CapCut / OpenAI Erdős 증명 / OpenAI IPO S-1',
    url: './daily-ai-brief-2026-05-25.html',
    num: '001'
  }
];

function render() {
  const container = document.getElementById('archive');
  BRIEFS.forEach(b => {
    const a = document.createElement('a');
    a.href = b.url;
    a.className = 'entry-row';
    a.innerHTML = `
      <div class="entry-row-inner">
        <span class="entry-row-date">• ${b.displayDate}</span>
        <div class="entry-row-right">
          <div class="entry-row-title">${b.title} — No.${b.num}</div>
          <div class="entry-row-desc">${b.desc}</div>
        </div>
      </div>`;
    container.appendChild(a);
  });
}

render();

// Nav brand → latest brief
document.getElementById('nav-brand-link').href = BRIEFS[0].url;
</script>

</body>
</html>
